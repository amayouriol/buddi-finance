    <rect y="78" width="206" height="30" rx="15" fill="#e4f1f9"/><circle cx="17" cy="93" r="4" fill="#489ed4"/><text x="30" y="97" font-size="11" font-weight="700" letter-spacing="1.05" fill="#4788ad">PRODUCT CONCEPT</text>
    <text y="178" font-size="48" font-weight="780" letter-spacing="-2.1">Your money,</text><text y="232" font-size="48" font-weight="780" letter-spacing="-2.1">together.</text><text y="280" font-size="17" fill="#667581">Personal spending and shared bills,</text><text y="306" font-size="17" fill="#667581">clear in one place.</text><line y1="344" x2="340" y2="344" stroke="#d7e1e8"/>
    <g transform="translate(0 370)"><circle cx="15" cy="15" r="15" fill="#e4f2fb"/><path d="m9 15 4 4 8-9" fill="none" stroke="#378abe" stroke-width="2" stroke-linecap="round"/><text x="43" y="12" font-size="14" font-weight="700">One personal ledger</text><text x="43" y="33" font-size="12" class="muted">Accounts, spending and activity</text></g>
    <g transform="translate(0 432)"><circle cx="15" cy="15" r="15" fill="#e5f5ed"/><path d="m9 15 4 4 8-9" fill="none" stroke="#4c9c79" stroke-width="2" stroke-linecap="round"/><text x="43" y="12" font-size="14" font-weight="700">Shared without the hassle</text><text x="43" y="33" font-size="12" class="muted">Track who paid and who owes</text></g>
    <g transform="translate(0 494)"><circle cx="15" cy="15" r="15" fill="#fff0e8"/><path d="m9 15 4 4 8-9" fill="none" stroke="#db8b61" stroke-width="2" stroke-linecap="round"/><text x="43" y="12" font-size="14" font-weight="700">You stay in control</text><text x="43" y="33" font-size="12" class="muted">Review every suggested entry</text></g><text y="602" font-size="11" fill="#8b98a2">A preview of the planned Buddi experience</text>
  </g>
