    <rect x="20" y="472" width="262" height="154" rx="15" fill="#f5f9fc" stroke="#e4edf3"/><text x="38" y="501" font-size="13" font-weight="700">Split preview</text><rect x="211" y="484" width="54" height="23" rx="11" fill="#e1f1fb"/><text x="238" y="499" text-anchor="middle" font-size="9" font-weight="700" fill="#448bb5">EQUAL</text>
    <text x="38" y="535" font-size="11" fill="#687782">Your share</text><text x="262" y="535" text-anchor="end" font-size="12" font-weight="700">$24.00</text><text x="38" y="563" font-size="11" fill="#687782">Jamie owes you</text><text x="262" y="563" text-anchor="end" font-size="12" font-weight="700" fill="#489a75">$24.00</text><text x="38" y="591" font-size="11" fill="#687782">Sam owes you</text><text x="262" y="591" text-anchor="end" font-size="12" font-weight="700" fill="#489a75">$24.00</text><text x="38" y="615" font-size="11" fill="#687782">Taylor owes you</text><text x="262" y="615" text-anchor="end" font-size="12" font-weight="700" fill="#489a75">$24.00</text>
    <rect x="20" y="648" width="262" height="51" rx="13" fill="#202a33"/><text x="151" y="679" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Review shared expense  →</text><text x="151" y="728" text-anchor="middle" font-size="10" class="muted">Names stay in your ledger. No invites needed.</text>
  </g>
