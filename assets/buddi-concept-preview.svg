    <rect x="20" y="680" width="262" height="48" rx="15" fill="#fff" stroke="#e8edf1"/><circle cx="39" cy="698" r="11" fill="#e7f3fc"/><text x="39" y="702" text-anchor="middle" font-size="11" fill="#398abb">⌂</text><text x="61" y="710" font-size="10" fill="#5a6872">Home</text><text x="126" y="710" font-size="10" fill="#89949d">Activity</text><text x="198" y="710" font-size="10" fill="#89949d">Groups</text><text x="255" y="710" font-size="10" fill="#89949d">You</text>
  </g>
