<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">Buddi — personal money, shared clearly</title>
  <desc id="desc">Concept preview of Buddi's planned mobile app: a personal finance overview, shared expense split, and editable AI-assisted transaction draft.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f7fa"/><stop offset="1" stop-color="#eaf2f8"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#69b7ef"/><stop offset="1" stop-color="#3d96d2"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#24394a" flood-opacity=".12"/></filter>
    <style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#202a33}.muted{fill:#83909b}.small{font-size:12px}.label{font-size:11px;font-weight:700;letter-spacing:1.15px}.heading{font-size:22px;font-weight:750;letter-spacing:-.55px}.money{font-size:31px;font-weight:750;letter-spacing:-1px}.phone{fill:#fff;stroke:#dfe7ed;stroke-width:1.2}</style>
  </defs>
  <rect width="1600" height="940" rx="30" fill="url(#bg)"/><circle cx="1490" cy="115" r="150" fill="#fff" opacity=".35"/><circle cx="95" cy="835" r="180" fill="#fff" opacity=".28"/>
  <g transform="translate(104 86)">
