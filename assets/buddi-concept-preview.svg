    <g transform="translate(24 536)"><circle cx="17" cy="17" r="17" fill="#e7f3fc"/><text x="17" y="21" text-anchor="middle" font-size="14">⌂</text><text x="46" y="14" font-size="12" font-weight="700">Groceries</text><text x="46" y="31" font-size="10" class="muted">Yesterday · Home crew</text><text x="254" y="21" text-anchor="end" font-size="12" font-weight="700">−$24.00</text></g><line x1="24" y1="592" x2="278" y2="592" stroke="#edf0f3"/>
